name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: test (race detector)
        run: go test -race -count=1 ./...
      - name: fuzz smoke (30 s each)
        run: |
          go test ./internal/filter/ -run XXX -fuzz FuzzCanonicalRoundTrip -fuzztime 30s
          go test ./internal/normalize/ -run XXX -fuzz FuzzFold -fuzztime 30s
      - name: vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: build linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" -o dials ./cmd/dials
      - uses: actions/upload-artifact@v4
        with:
          name: dials-linux-amd64
          path: dials
